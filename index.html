<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Addiction Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Addiction Tracker</h1>

    <input

        type="text"

        placeholder="Add Addiction"

        id="addictionInput"

    >

    <button id="addAddictionBtn">

        Add

    </button>

    <div id="app">

        <div id="sidebar">

            <h2>Addictions</h2>

            <div id="addictionsContainer"></div>

        </div>

        <div id="main">

            <div id="selectedAddictionContainer"></div>

        </div>

    </div>

</body>
<script src="script.js"></script>
</html>
